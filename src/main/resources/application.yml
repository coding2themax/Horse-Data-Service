#spring.application.name=horse-data-service
spring:
  application:
    name: horse-data-service
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      javax:
        persistance:
          scripts:
            action: create
            create-target: schema-all.sql
            create-source: metedata

  r2dbc:
    url: ${postgres-url}
    username: ${postgres-username}
    password: ${postgres-password}

server:
  port: 13000
