version: "3"
services:
  horse-catalog-service:
    image: "horse-catalog-service"
    build:
      context: .
      args:
        MODULE: horse-catalog-service
    container_name: horse-catalog-service
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_JDBC_URL: jdbc:postgresql://db:5432/horse-data-service
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "13000:13000"
    restart: always
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres
    restart: always
    init: true
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: horse-data-service
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
