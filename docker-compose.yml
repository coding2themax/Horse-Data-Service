x-postgres-image: &postgres-image postgres:${POSTGRES_VERSION:-17}-alpine

x-database-credentials: &database-credentials
  DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}

x-saga-service: &saga-service
  restart: always
  depends_on:
    db-init:
      condition: service_completed_successfully
    kafka:
      condition: service_healthy

services:
  db:
    image: *postgres-image
    restart: always
    init: true
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      POSTGRES_DB: horse-data-service
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  db-init:
    image: *postgres-image
    restart: "no"
    environment:
      PGHOST: db
      PGDATABASE: horse-data-service
      PGUSER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      PGPASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init-databases.sql"]
    volumes:
      - ./docker/init-databases.sql:/init-databases.sql:ro
    depends_on:
      db:
        condition: service_healthy

  kafka:
    image: apache/kafka-native:3.8.0
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /home/appuser/kafka-logs
    volumes:
      - kafka-data:/home/appuser
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 24

  horse-catalog-service:
    image: horse-catalog-service
    build:
      context: .
      args:
        MODULE: horse-catalog-service
        SERVICE_PORT: 13000
    restart: always
    environment:
      <<: *database-credentials
      DATABASE_HOST: ${DATABASE_HOST:-r2dbc:postgresql://db:5432/horse-data-service}
      DATABASE_JDBC_URL: ${DATABASE_JDBC_URL:-jdbc:postgresql://db:5432/horse-data-service}
    ports:
      - "13000:13000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13000/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24

  stock-service:
    <<: *saga-service
    image: horse-stock-service
    build:
      context: .
      args:
        MODULE: stock-service
        SERVICE_PORT: 13020
    environment:
      <<: *database-credentials
      DATABASE_HOST: r2dbc:postgresql://db:5432/horse_stock
      DATABASE_JDBC_URL: jdbc:postgresql://db:5432/horse_stock
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:13020:13020"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13020/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24

  order-service:
    <<: *saga-service
    image: horse-order-service
    build:
      context: .
      args:
        MODULE: order-service
        SERVICE_PORT: 13010
    environment:
      <<: *database-credentials
      DATABASE_HOST: r2dbc:postgresql://db:5432/horse_orders
      DATABASE_JDBC_URL: jdbc:postgresql://db:5432/horse_orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:13010:13010"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13010/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24

  saga-orchestrator:
    <<: *saga-service
    image: horse-saga-orchestrator
    build:
      context: .
      args:
        MODULE: saga-orchestrator
        SERVICE_PORT: 13030
    environment:
      <<: *database-credentials
      DATABASE_HOST: r2dbc:postgresql://db:5432/horse_saga
      DATABASE_JDBC_URL: jdbc:postgresql://db:5432/horse_saga
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:13030:13030"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13030/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  kafka-data:
